<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08080a">
<title>Origin Chat</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a0a0d'/%3E%3Cg fill='none' stroke='%23c7b4ff' stroke-width='1.5'%3E%3Ccircle cx='16' cy='16' r='5'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='5.6' transform='rotate(-28 16 16)'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600;700&family=Unbounded:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=29">
</head>
<body>

<section class="landing" id="landing">
  <div class="land-bg" aria-hidden="true">
    <svg class="land-rings" viewBox="0 0 1200 1200" fill="none">
      <ellipse cx="600" cy="600" rx="560" ry="196" stroke="#ffffff" stroke-opacity=".10" transform="rotate(-14 600 600)"/>
      <ellipse cx="600" cy="600" rx="430" ry="330" stroke="#ffffff" stroke-opacity=".06" transform="rotate(22 600 600)"/>
      <ellipse cx="600" cy="600" rx="300" ry="450" stroke="#ffffff" stroke-opacity=".04" transform="rotate(-4 600 600)"/>
      <circle cx="600" cy="600" r="5" fill="#ffffff" fill-opacity=".45"/>
    </svg>
    <canvas class="land-fx" id="landFx" aria-hidden="true"></canvas>
    <div class="land-glow" id="landGlow" aria-hidden="true"></div>
    <div class="land-vignette"></div>
  </div>
  <div class="land-scroll" id="landScroll">
    <section class="land-hero" aria-label="Origin Chat">
      <h1 class="land-title"><span class="originline"><span>Origin</span><i class="orb" aria-hidden="true"></i></span><span class="dim">Chat</span></h1>
      <button class="land-arrow" data-scroll-down aria-label="Вниз"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="m6 13 6 6 6-6"/></svg></button>
    </section>
    <section class="land-info" id="landInfo">
      <div class="info-inner">
        <h2 class="info-title">Спросите про код, текст<br>или задачу — <span>Origin ответит</span></h2>
        <div class="info-cta">
          <button class="cta-hero" id="ctaHero" data-cta aria-label="Открыть чат"><span id="ctaHeroLabel">Присоединиться</span><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button>
        </div>
      </div>
    </section>
  </div>
</section>

<section class="authpage" id="auth" hidden>
  <div class="auth-bg" aria-hidden="true"><div class="auth-glow"></div></div>
  <header class="auth-top">
    <button class="auth-back" data-back aria-label="Назад">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m11 6-6 6 6 6"/></svg>
    </button>
    <span class="brand"><svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="5.1"/><ellipse cx="16" cy="16" rx="12.6" ry="5.9" transform="rotate(-28 16 16)"/><circle class="sat" cx="26.1" cy="10.4" r="1.6"/></svg><span class="brandname">Origin</span><span class="brandsub">Chat</span></span>
    <span class="auth-topgap"></span>
  </header>
  <div class="auth-body">
    <div class="auth-side" aria-hidden="true">
      <h1 class="auth-side-title">Origin<br><span>Chat</span></h1>
    </div>
    <div class="auth-center">
      <form class="auth-card" id="signin" novalidate>
      <div class="card-head">
        <h2>Вход</h2>
      </div>
      <label class="fld"><span>Email</span><input type="email" name="email" placeholder="you@studio.ru" autocomplete="email" required></label>
      <label class="fld"><span>Пароль</span>
        <span class="field-wrap">
          <input type="password" name="password" placeholder="Минимум 6 символов" autocomplete="current-password" minlength="6" required>
          <button type="button" class="field-eye" data-eye aria-label="Показать пароль"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3.2"/></svg></button>
        </span>
      </label>
      <div class="auth-row"><label class="check"><input type="checkbox" name="remember" checked><i></i><span>Запомнить меня</span></label><button type="button" class="linkbtn" data-forgot>Забыли пароль?</button></div>
      <button class="btn primary wide" type="submit">Войти <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg></button>
    </form>
    </div>
  </div>
</section>

<div class="app" id="app" hidden>
  <aside class="side" id="side" aria-label="Навигация">
    <div class="side-top">
      <button class="brand small" data-view="chat" aria-label="Origin Chat — к диалогу">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="5.1"/><ellipse cx="16" cy="16" rx="12.6" ry="5.9" transform="rotate(-28 16 16)"/><circle class="sat" cx="26.1" cy="10.4" r="1.6"/></svg>
        <span class="brandname">Origin</span><span class="brandsub">Chat</span>
      </button>
    </div>
    <button class="newchat" data-new>
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M13 4H6.5A2.5 2.5 0 0 0 4 6.5v11A2.5 2.5 0 0 0 6.5 20h11a2.5 2.5 0 0 0 2.5-2.5V11"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L12 14l-4 1 1-4z"/></svg>
      Новый диалог
      <span class="kbd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg></span>
    </button>
    <div class="side-search">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.4"/><path d="m16 16 4 4"/></svg>
      <input id="search" type="search" placeholder="Поиск по чатам" aria-label="Поиск по чатам" autocomplete="off">
    </div>
    <div class="side-chats" id="chatlist"></div>
    <div class="side-foot">
      <button class="side-link" data-view="dash">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 13h5v7H4zM10 4h5v16h-5zM16 9h4v11h-4z"/></svg>
        Дашборд
      </button>
      <button class="side-user" data-view="acc">
        <span class="avatar" id="sideAvatar">?</span>
        <span class="who"><b id="sideName">—</b><small id="sidePlan">—</small></span>
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
      </button>
    </div>
  </aside>
  <div class="scrim" id="scrim" hidden></div>

  <main class="main" id="main">
    <header class="topbar">
      <button class="iconbtn menubtn" data-menu aria-label="Открыть меню">
        <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="crumbs"><b id="crumb">Диалог</b></div>
      <div class="topbar-right">

        <button class="iconbtn" data-chatmenu title="Действия с диалогом" aria-label="Действия с диалогом">
          <svg class="ico" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
        </button>

      </div>
    </header>


    <section class="view chat" id="viewChat">
      <div class="thread" id="messages" aria-live="polite"></div>
      <div class="composer-wrap">
        <form class="composer" id="composer">
          <div class="attachrow" id="attachrow"></div>
          <textarea id="prompt" rows="1" placeholder="Спросите что угодно — код, текст, разбор задачи…" aria-label="Сообщение"></textarea>
          <div class="composer-bar">
            <button type="button" class="pill" id="modelpill" aria-haspopup="listbox">
              <span id="modelpillIcon"></span><span id="modelname2">Gemma 3 270M</span>
              <svg class="ico chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
            </button>
            <span class="grow"></span>
            <button class="ctxmeter" id="ctxmeter" type="button" title="Контекст диалога"><svg viewBox="0 0 20 20" aria-hidden="true"><circle class="ctxbg" cx="10" cy="10" r="8"></circle><circle class="ctxfg" cx="10" cy="10" r="8"></circle></svg><span class="ctxpct" id="ctxpct">0%</span></button>
            <button type="submit" class="send" id="send" aria-label="Отправить">
              <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m6 11 6-6 6 6"/></svg>
            </button>
            <button type="button" class="stopbtn" id="stop" hidden aria-label="Остановить"><svg class="ico" viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg></button>
          </div>
        </form>
        <p class="composer-note">Origin может ошибаться. Проверяйте важные ответы.</p>
      </div>
    </section>

    <section class="view dash" id="viewDash" hidden></section>
    <section class="view acc" id="viewAcc" hidden></section>
  </main>
</div>

<div class="palette" id="palette" hidden>
  <div class="palette-box" role="dialog" aria-label="Команды">
    <div class="palette-head">
      <svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.4"/><path d="m16 16 4 4"/></svg>
      <input id="paletteInput" placeholder="Команда или чат…" aria-label="Команда">
      <kbd>esc</kbd>
    </div>
    <div class="palette-list" id="paletteList"></div>
  </div>
</div>

<div class="modal" id="modal" hidden><div class="modal-box" id="modalBox" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js?v=29"></script>
</body>
</html>
